<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
<main>
    <section>
        <h1>Login</h1>
        <p>Enter your account details to view products.</p>

        <form id="loginForm">
            <label for="usernameInput">Username</label>
            <input id="usernameInput" name="username" autocomplete="username" required>
            <br>
            <label for="passwordInput">Password</label>
            <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
            <br>
            <button id="loginButton" type="submit" >Login</button>
        </form>

        <p id="loginStatus"></p>

        <table>
            <caption><b>Demo users</b></caption>
            <thead>
                <tr>
                    <th scope="col">Username</th>
                    <th scope="col">Password</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>renter1</td>
                    <td>renter123</td>
                </tr>
                <tr>
                    <td>renter2</td>
                    <td>renter456</td>
                </tr>
                <tr>
                    <td>admin</td>
                    <td>admin123</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
