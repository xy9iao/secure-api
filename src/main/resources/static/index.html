<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Secure API JWT Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
        }

        input, button {
            padding: 10px;
            margin: 6px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #ddd;
        }

        pre {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Secure API JWT Demo</h1>
    <p class="hint">
        This page demonstrates login, JWT generation, and access to a protected REST API.
    </p>

    <div class="section">
        <h2>1. Login</h2>

        <input id="username" value="alice" placeholder="Username">
        <input id="password" value="password123" placeholder="Password" type="password">

        <button onclick="login()">Login and Get JWT</button>

        <h3>JWT Token</h3>
        <pre id="tokenOutput">No token yet.</pre>
    </div>

    <div class="section">
        <h2>2. Call Protected API</h2>

        <button onclick="callProtectedApi()">Call /api/secure/hello with JWT</button>
        <button onclick="callProtectedApiWithoutToken()">Call /api/secure/hello without JWT</button>

        <h3>API Response</h3>
        <pre id="apiOutput">No API response yet.</pre>
    </div>
</div>

<script>
    let jwtToken = "";

    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                const errorText = await response.text();
                document.getElementById("tokenOutput").textContent =
                    "Login failed: " + errorText;
                return;
            }

            const data = await response.json();
            jwtToken = data.token;

            document.getElementById("tokenOutput").textContent = jwtToken;
        } catch (error) {
            document.getElementById("tokenOutput").textContent =
                "Error: " + error.message;
        }
    }

    async function callProtectedApi() {
        try {
            const response = await fetch("/api/secure/hello", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            const text = await response.text();

            document.getElementById("apiOutput").textContent =
                "Status: " + response.status + "\n\n" + text;
        } catch (error) {
            document.getElementById("apiOutput").textContent =
                "Error: " + error.message;
        }
    }

    async function callProtectedApiWithoutToken() {
        try {
            const response = await fetch("/api/secure/hello", {
                method: "GET"
            });

            const text = await response.text();

            document.getElementById("apiOutput").textContent =
                "Status: " + response.status + "\n\n" + text;
        } catch (error) {
            document.getElementById("apiOutput").textContent =
                "Error: " + error.message;
        }
    }
</script>
</body>
</html>
